[pytest]
# 测试目录
testpaths = Tests

# 测试文件命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加Src目录到Python路径
pythonpath = Src

# 测试发现
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=Src
    --cov-report=term-missing
    --cov-report=html:htmlcov

# 测试标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    gui: 需要GUI的测试
